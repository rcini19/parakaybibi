<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ECE Review Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=6">
  <script>
    // Show the password screen unless this device is already logged in (sync.js keeps this flag up to date).
    try { if (localStorage.getItem('ece-tracker.v1.auth') !== '1') document.documentElement.classList.add('locked'); }
    catch (e) { document.documentElement.classList.add('locked'); }
  </script>
</head>
<body>
  <div class="lock">
    <form id="loginForm" class="lock-box" autocomplete="on">
      <label for="loginPw">PASSWORD</label>
      <input type="text" name="username" value="bibi" autocomplete="username" hidden>
      <input type="password" id="loginPw" class="box" autocomplete="current-password" required autofocus>
      <button class="btn dark" type="submit" id="loginBtn">ENTER</button>
      <p class="sync-err" id="loginErr"></p>
      <button type="button" class="linkbtn" data-a="lock-pw">Change password</button>
    </form>
    <form class="lock-box pw-change" autocomplete="on" hidden>
      <label>CHANGE PASSWORD</label>
      <input type="text" name="username" value="bibi" autocomplete="username" hidden>
        <input type="password" data-pw="cur" class="box sm" placeholder="Current password" autocomplete="current-password" required>
        <input type="password" data-pw="new" class="box sm" placeholder="New password (6+ characters)" autocomplete="new-password" minlength="6" required>
        <input type="password" data-pw="new2" class="box sm" placeholder="Type the new password again" autocomplete="new-password" minlength="6" required>
        <button class="btn dark" type="submit" data-pw="btn">SET NEW PASSWORD</button>
        <p class="sync-err" data-pw="msg"></p>
      <button type="button" class="linkbtn" data-a="lock-back">‹ Back</button>
    </form>
  </div>

  <div class="wrap">
    <!-- Clock -->
    <header class="top">
      <div class="cell c-day"><label>DAY</label><div class="box big" id="clkDay">--</div></div>
      <div class="cell c-month"><label>MONTH</label><div class="box big" id="clkMonth">--</div></div>
      <div class="cell c-year"><label>YEAR</label><div class="box big" id="clkYear">--</div></div>
      <div class="cell c-quote"><label>&nbsp;</label><div class="box quote" id="quote" data-a="next-quote" title="Click for another quote"></div></div>
      <div class="cell c-time"><label>TIME</label><div class="box big" id="clk12">--:--</div></div>
      <div class="cell c-24"><label>24-HOUR TIME</label><div class="box big" id="clk24">--:--</div></div>
    </header>

    <!-- Exam countdown -->
    <section class="countdown">
      <strong id="examName">ECELE</strong>
      <span id="examDate"></span>
      <em id="examLeft"></em>
    </section>

    <nav class="tabs">
      <button data-a="tab" data-tab="today">TODAY</button>
      <button data-a="tab" data-tab="weekly">WEEKLY</button>
      <button data-a="tab" data-tab="subjects">SUBJECTS</button>
      <button data-a="tab" data-tab="settings">SETTINGS</button>
      <button id="syncStatus" class="sync-pill loading" data-a="sync-pill" title="Cloud sync">☁ …</button>
      <button id="logoutBtn" data-a="sync-signout" hidden>LOG OUT</button>
    </nav>

    <main id="view"></main>
  </div>

  <div class="toast" id="toast" hidden></div>
  <script src="app.js?v=6"></script>
  <script type="module" src="sync.js?v=6"></script>
</body>
</html>
